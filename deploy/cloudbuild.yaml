steps:
  # Pull the latest image for layer caching
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'docker pull gcr.io/$PROJECT_ID/blt-typesense:latest || exit 0'

  # Build the container image with cache from previous build
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/blt-typesense:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/blt-typesense:latest'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/blt-typesense:latest'
      - '.'

  # Push the container images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/blt-typesense:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/blt-typesense:latest']

  # Deploy to Cloud Run using declarative spec (matches blt-api-prod pattern)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        sed -i 's|IMAGE_PLACEHOLDER|gcr.io/'"$PROJECT_ID"'/blt-typesense:'"$COMMIT_SHA"'|g' deploy/cloudrun-service-prod.yaml
        gcloud run services replace deploy/cloudrun-service-prod.yaml --region=europe-west2

images:
  - 'gcr.io/$PROJECT_ID/blt-typesense:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/blt-typesense:latest'

substitutions:
  COMMIT_SHA: 'latest'

options:
  logging: CLOUD_LOGGING_ONLY
